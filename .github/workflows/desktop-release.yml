name: Desktop installers

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm desktop:dist
      - run: pnpm test:installers
      - run: pnpm test:onboarding
      - uses: actions/upload-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: apps/desktop/release/installers/*
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: installers
      - name: Attach verified installers to a release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Crewvane｜协航 0.4.4 · macOS Apple Silicon

          本版为“新目标”加入图片附件：可直接粘贴截图、拖入图片或从本机选择 PNG、JPEG、WebP、GIF。
          图片由主进程校验格式与大小并保存到工作区的 .crewvane/attachments；状态只记录元数据，不保存 Base64。
          管家通知和负责人任务包含真实绝对路径，CLI 的 ask / direct 也支持重复 --attachment 参数。
          Herdr 管家直聊收到可保存的图片文件时，会通过 crewvane direct 写回 App。
          每张图片可立即删除；已结束目标的原图默认保留 30 天，之后随桌面启动自动清理。
          已完成或已放弃的目标可永久删除；目标结束或删除时，对应负责人 Tab 会自动关闭。
          目标详情完整保留对话与动态；负责人对咨询的答复必须写回具体正文，不再只显示“已回答”。

          本版完善 Herdr 内闭环：插件随应用自动安装，可直接打开注意力或一句话新建目标。
          项目可配置三档上线策略，默认 external-approval；批准和拒绝写入共享决定账本，同类问题不再重复打扰。
          删除数据、停服、花钱、外发消息、改产品方向、新建或轮换密钥、改权限、改上线策略始终升级给人。
          同一目标最多三轮审查，第四轮进入注意力并由人决定是否增加一轮。
          等待事项可在桌面或 Herdr 内继续交给管家、人工接管、跟进和稍后提醒；待验收事项可直接通过或退回。
          修复 Herdr 原生事件 envelope 解析，并同步 Pane、Tab 与 Workspace 关闭状态，减少失效现场和串案。
          Herdr 管家终端直聊会通过 Crewvane CLI 即时写回 App；同一消息不会重复派发。
          直聊中新任务会原子切换管家案卷 scope，管家可在同一回合继续整理和派发。
          目标详情不再要求为常规推进填写表单；补充意见、等待下一步和验收入口按当前状态直接出现。
          每个通知只处理一个案卷；全局管家仍只负责分发、协调和向人交接，实际成果由独立负责人交付。
          Agent 启动命令完整保留用户配置的 CLI 和原生参数，不注入 Codex 专属沙箱选项。
          Herdr 与 Crewvane CLI 自动准备并复用已有最新版，无需 Homebrew；设置页会即时显示自动安装结果。
          自定义交互式 CLI 可直接运行。
          Crewvane CLI 可直接与管家对话或新建目标，并与桌面共用锁保护的本地状态。
          0.4 工作区数据不兼容 0.3；请选择新的工作区目录。

          下载 Assets 中的 .dmg，将 Crewvane.app 拖入 Applications；也可下载 .zip 解压安装。
          SHA256SUMS.txt 可用于校验下载文件。GitHub 自动生成的 Source code 是源码，不是安装包。
          v0.3.0 的应用包签名不完整，请改用 v0.4.4；不要继续安装旧包。
          本内测版尚未进行 Apple Developer ID 签名与公证，macOS 可能提示无法验证开发者。
          核对发布来源后，可在系统设置 > 隐私与安全性中按提示选择仍要打开。
          使用说明：https://github.com/gdli6177/crewvane/blob/main/docs/crewvane.md
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json; then
            test "$(jq -r .isDraft existing.json)" = true || { echo 'Published release is immutable to this workflow'; exit 1; }
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --draft --prerelease --verify-tag \
              --title "Crewvane $RELEASE_TAG" --notes-file notes.md
          fi
