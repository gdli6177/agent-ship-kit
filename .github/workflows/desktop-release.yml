name: Desktop installers

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # This GitHub-hosted image is Apple Silicon, so node-pty matches the DMG.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and sign desktop installers
        run: pnpm desktop:dist
        env:
          # Avoid the shared, unauthenticated GitHub API quota on hosted runners.
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm test:desktop
      - run: pnpm test:installers
      - run: pnpm test:onboarding
      - uses: actions/upload-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: apps/desktop/release/installers/*
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: installers
      - name: Attach verified installers to a release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Crewvane｜协航 0.6.0 · macOS Apple Silicon

          ## 本版更新

          - 场景优先：真实现场介入与普通活动目标直接打开 Herdr，不再先经过大详情弹窗。
          - 决定、验收、到期跟进和派发失败使用轻量动作卡，当前依据和主操作在同一视野，仍可显式查看完整记录。
          - 现场顶部增加目标条，显示项目、状态和结构化当前事项，可回到注意力或查看目标记录；隐藏终端不终止会话。
          - 终端滚动历史保留在 Herdr，不自动注入 Agent 上下文，也不被当作完成或验收依据。
          - 设置页显示当前工作区的实际 Herdr Session 和外部连接命令；mise、Homebrew 或内置二进制只是可执行文件来源，不是另一套目标现场。
          - 已结束目标打开历史记录；派发失败保留重试入口；普通消息、决定和验收仍严格使用结构化命令。
          - 打开旧版、未来版本、损坏或缺快照的工作区时，先完整归档原 `.crewvane` 为 `.crewvane.backup-*`，再自动创建兼容的新工作区，并在界面与 CLI 中显示备份位置。

          Herdr 自动同步的是现场身份、生命周期和状态。终端输出不会自动变成目标消息、进展或验收；Agent 仍需通过 Crewvane CLI 和 Crewvane Skill 显式写回语义事实。

          ## 安装

          仅支持 Apple Silicon Mac（arm64）。从 Assets 下载 .dmg，将 Crewvane.app 拖入 Applications；也可下载 .zip 解压安装。
          SHA256SUMS.txt 可用于校验下载文件。GitHub 自动生成的 Source code 是源码，不是安装包。
          安装或替换应用后，请在设置中重新安装 Crewvane CLI，并按需安装或更新 Crewvane Skills。
          旧版、未来版本、损坏或缺快照的工作区会先完整备份，再自动创建兼容的新工作区。
          本内测版没有 Apple Developer ID 签名与公证，macOS 可能提示无法验证开发者。
          核对发布来源后，可在系统设置 > 隐私与安全性中按提示选择仍要打开。
          使用说明：https://github.com/gdli6177/crewvane/blob/main/docs/crewvane.md
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json; then
            test "$(jq -r .isDraft existing.json)" = true || { echo 'Published release is immutable to this workflow'; exit 1; }
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --draft --prerelease --verify-tag \
              --title "Crewvane $RELEASE_TAG" --notes-file notes.md
          fi
