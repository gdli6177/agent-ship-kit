name: Desktop installers

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # GitHub's current standard macOS runner image is Apple Silicon. Keep the
    # installer smoke test on that architecture so node-pty matches the DMG.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm desktop:dist
      - run: pnpm test:desktop
      - run: pnpm test:installers
      - run: pnpm test:onboarding
      - uses: actions/upload-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: apps/desktop/release/installers/*
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: installers
      - name: Attach verified installers to a release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Crewvane｜协航 0.5.0 · macOS Apple Silicon

          本版重新组织目标详情：内容、状态和操作彼此解耦，Agent 的自然语言与附件原样展示，按钮只由明确状态驱动，不再解析聊天正文猜测批准或验收。
          “注意力”和“全部目标”打开同一详情，完整保留当前目标与管家的问答历史；自己的消息会发给管家，但不会自行改变目标状态或下一步。
          状态只由 Crewvane core 控制。桌面、CLI、Herdr 和插件都只提交命令，经校验、工作区串行锁、原子持久化和事件追加后才发布新快照，旧派发回执不能覆盖新状态。
          支持消息、等待、验收、退回、人工接管、继续推进、图片回复、目标永久删除和目标结束后自动关闭负责人会话。
          “工序”入口已从产品中移除；开发、设计、测试等流程交给 Agent skill、目标原文或未来的可选插件，不再成为所有目标的必填结构。
          新增可选 Webhook 通知：决定、验收、到期跟进和介入事项首次进入注意力时发送一次，支持 Bearer 鉴权、跨重启去重与失败退避；载荷不包含聊天历史、附件或本机路径。
          UI 完成深浅双主题的注意力中心重设计：统一字号与焦点体系，提高浅色主题对比度，精简空状态和重复动作，目标详情、设置、图片回复及 900–1400px 桌面宽度完成自动对比度、裁切、可访问名称和点击目标审计。

          安装包现在内置经 SHA-256 校验的 Herdr 0.9.5，首次启动无需 Homebrew、系统 PATH 或额外下载；联网时只查询轻量最新版信息，需要时再更新到应用私有目录。
          Herdr 插件随应用自动安装，可打开注意力或一句话新建目标。
          修复“找管家”在 Codex 信任确认、登录或其他 blocked 提示下报错且无法进入现场的问题：已有现场会直接聚焦真实 Tab/Pane，不发送身份 prompt，也不自动输入 Enter、Esc。完成或关闭提示后即可继续派发。
          Agent 启动命令完整保留用户配置的 CLI 和原生参数；不注入 Codex 专属沙箱选项，自定义交互式 CLI 可以直接接入。
          每个工作区仍只有一位全局管家，只负责分发、协调和向人交接；实际成果由独立负责人交付。CLI 可发送消息或新建目标，并与桌面共用锁保护的本地状态。

          下载 Assets 中的 .dmg，将 Crewvane.app 拖入 Applications；也可下载 .zip 解压安装。
          SHA256SUMS.txt 可用于校验下载文件。GitHub 自动生成的 Source code 是源码，不是安装包。
          请使用 v0.5.0；不要继续安装旧包。
          本内测版尚未进行 Apple Developer ID 签名与公证，macOS 可能提示无法验证开发者。
          核对发布来源后，可在系统设置 > 隐私与安全性中按提示选择仍要打开。
          使用说明：https://github.com/gdli6177/crewvane/blob/main/docs/crewvane.md
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json; then
            test "$(jq -r .isDraft existing.json)" = true || { echo 'Published release is immutable to this workflow'; exit 1; }
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --draft --prerelease --verify-tag \
              --title "Crewvane $RELEASE_TAG" --notes-file notes.md
          fi
