name: Desktop installers

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # This GitHub-hosted image is Apple Silicon, so node-pty matches the DMG.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and sign desktop installers
        run: pnpm desktop:dist
        env:
          # Avoid the shared, unauthenticated GitHub API quota on hosted runners.
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm test:desktop
      - run: pnpm test:installers
      - run: pnpm test:onboarding
      - uses: actions/upload-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: apps/desktop/release/installers/*
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: installers
      - name: Attach verified installers to a release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Crewvane｜协航 0.5.2 · macOS Apple Silicon

          ## 本版更新

          - 修复企业微信在同一目标进入待验收时重复收到状态变化和注意力提醒：现在只发送覆盖该状态的 `attention.required`，一个目标变化只产生一条外部消息。
          - Herdr 现场同步会跟随真实 Agent 身份、状态、Pane 移动和退出，并校验前台 PID；不会把任务投给已替换的进程，也不会关闭用户手工启动的会话。
          - 设置页可把随应用打包的 Crewvane Skill 安装或更新到检测到的通用 Agent Skills、Codex、Claude Code 和 Cursor 目录；已有同名且非 Crewvane 管理的 Skill 不会被覆盖。
          - 内置 Herdr 终端支持拖动、调整大小、全屏和隐藏，以及系统剪贴板复制粘贴；关闭后重新打开会继续同一真实会话。
          - 目标弹窗改为“当前动作 + 对话交接”的双栏工作台：决定、验收、跟进所需的信息与主操作在同一视野，对话最新在上，系统事件单独折叠，并避免最近交接在左右两栏重复。
          - 左上角“我的工作台”会明确显示当前注意力总览状态；目标管理中的“放弃目标”改为应用内确认和原因记录，不再依赖 Electron 不支持的系统输入框。
          - 修复浅色主题阻塞状态对比度不足和运行时错误小字难读的问题。

          Herdr 自动同步的是现场身份、生命周期和状态。终端输出不会自动变成目标消息、进展或验收；Agent 仍需通过 Crewvane CLI 和 Crewvane Skill 显式写回语义事实。

          ## 安装

          仅支持 Apple Silicon Mac（arm64）。从 Assets 下载 .dmg，将 Crewvane.app 拖入 Applications；也可下载 .zip 解压安装。
          SHA256SUMS.txt 可用于校验下载文件。GitHub 自动生成的 Source code 是源码，不是安装包。
          安装或替换应用后，请在设置中重新安装 Crewvane CLI，并按需安装或更新 Crewvane Skills。
          本版不提供旧版工作区兼容层，首次使用请选择新工作区目录。
          本内测版没有 Apple Developer ID 签名与公证，macOS 可能提示无法验证开发者。
          核对发布来源后，可在系统设置 > 隐私与安全性中按提示选择仍要打开。
          使用说明：https://github.com/gdli6177/crewvane/blob/main/docs/crewvane.md
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json; then
            test "$(jq -r .isDraft existing.json)" = true || { echo 'Published release is immutable to this workflow'; exit 1; }
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --draft --prerelease --verify-tag \
              --title "Crewvane $RELEASE_TAG" --notes-file notes.md
          fi
