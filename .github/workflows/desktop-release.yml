name: Desktop installers

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm desktop:dist
      - run: pnpm test:installers
      - uses: actions/upload-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: apps/desktop/release/installers/*
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: installers
      - name: Attach verified installers to a release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Crewvane｜协航 macOS Apple Silicon 内测版

          下载 Assets 中的 .dmg，将 Crewvane.app 拖入 Applications；也可下载 .zip 解压安装。
          SHA256SUMS.txt 可用于校验下载文件。GitHub 自动生成的 Source code 是源码，不是安装包。
          本内测版尚未进行 Apple Developer ID 签名与公证，macOS 可能阻止首次打开。
          使用说明：https://github.com/gdli6177/crewvane/blob/main/docs/crewvane.md
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json; then
            test "$(jq -r .isDraft existing.json)" = true || { echo 'Published release is immutable to this workflow'; exit 1; }
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --draft --prerelease --verify-tag \
              --title "Crewvane $RELEASE_TAG" --notes-file notes.md
          fi
