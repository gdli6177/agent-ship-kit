name: Desktop installers

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm desktop:dist
      - run: pnpm test:installers
      - run: pnpm test:onboarding
      - uses: actions/upload-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: apps/desktop/release/installers/*
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crewvane-macOS-arm64
          path: installers
      - name: Attach verified installers to a release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Crewvane｜协航 macOS Apple Silicon 内测版

          0.4：一位全局管家统筹所有项目与个人事项。注意力聚合决定、验收、到期跟进和需要介入的问题。
          应用内 Herdr 终端支持隐藏与恢复；设置中可填写各角色的 CLI 启动命令及原生参数。
          工序为名称与提示词组成的说明书；内置 Crewvane CLI 与桌面共用目标状态。
          启动时自动检查并准备最新 Herdr CLI，无需 Homebrew；自定义 Agent 命令可直接在真实终端运行。
          工作台回到全部目标总览；工作区目录在设置中切换，项目在项目栏添加；菜单栏统一使用像素魔法师应用图标。
          管家只负责分发、跟进与向人交接；执行目标使用独立负责人现场，未分配时自动请管家核查。
          项目关联可选；通知送达、现场登记与真实连接分别显示。
          本版重做本地数据模型，不读取 0.3 的工作区状态；请选择新的工作区目录。

          下载 Assets 中的 .dmg，将 Crewvane.app 拖入 Applications；也可下载 .zip 解压安装。
          SHA256SUMS.txt 可用于校验下载文件。GitHub 自动生成的 Source code 是源码，不是安装包。
          v0.3.0 的应用包签名不完整，请使用 v0.3.1 或更新版本。
          本内测版尚未进行 Apple Developer ID 签名与公证，macOS 可能提示无法验证开发者。
          核对发布来源后，可在系统设置 > 隐私与安全性中按提示选择仍要打开。
          使用说明：https://github.com/gdli6177/crewvane/blob/main/docs/crewvane.md
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json; then
            test "$(jq -r .isDraft existing.json)" = true || { echo 'Published release is immutable to this workflow'; exit 1; }
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --draft --prerelease --verify-tag \
              --title "Crewvane $RELEASE_TAG" --notes-file notes.md
          fi
